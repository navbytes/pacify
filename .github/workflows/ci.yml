name: CI

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      relevant: ${{ steps.paths.outputs.relevant }}
    steps:
      - id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          EXPECTED_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            echo 'relevant=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > pr.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" > files.json
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > pr-after.json
          python3 - <<'PYTHON'
          import json, os, re
          pr = json.load(open('pr.json'))
          after = json.load(open('pr-after.json'))
          files = [f for page in json.load(open('files.json')) for f in page]
          complete = 0 < len(files) == pr['changed_files'] < 3000
          stable = all(p['head']['sha'] == os.environ['EXPECTED_HEAD']
                       and p['base']['sha'] == os.environ['EXPECTED_BASE']
                       and p['base']['ref'] == os.environ['EXPECTED_BASE_REF']
                       and p['changed_files'] == pr['changed_files'] for p in (pr, after))
          docs = re.compile(r'^(docs/|README[^/]*\.md$|CHANGELOG[^/]*\.md$|LICENSE[^/]*$|\.github/AUTOMATION\.md$)')
          paths = [path for f in files for path in (f['filename'], f.get('previous_filename', f['filename']))]
          relevant = not (complete and stable and all(docs.search(path) for path in paths))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'relevant={str(relevant).lower()}\n')
          PYTHON

  checks:
    name: Lint & Type Check
    if: ((github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false)) && needs.changes.outputs.relevant == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint & format (Biome)
        run: bun run check:ci

      - name: Type check (svelte-check)
        run: bun run check

      - name: Security audit
        run: bun audit --audit-level=high

  test:
    name: Unit Tests
    if: ((github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false)) && needs.changes.outputs.relevant == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Locale parity is asserted by the unit suite
      # (src/services/i18n/__tests__/localeParity.test.ts), so a separate
      # locale-validation step is unnecessary here.
      - name: Unit tests with coverage
        run: bun run test:coverage

  build:
    name: Build & Package
    if: ((github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false)) && needs.changes.outputs.relevant == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build extension
        run: bun run build

      - name: Validate manifest
        run: |
          jq empty dist/manifest.json
          for field in manifest_version name version; do
            jq -e ".${field}" dist/manifest.json > /dev/null \
              || { echo "manifest.json is missing required field: ${field}"; exit 1; }
          done
          [ "$(jq -r .manifest_version dist/manifest.json)" = "3" ] \
            || { echo "manifest_version must be 3"; exit 1; }
          [ -f dist/_locales/en/messages.json ] \
            || { echo "default locale messages missing from dist"; exit 1; }

      - name: Check version sync
        run: |
          # package.json and manifest.json must agree, or the released zip
          # carries a different version than the tag release-please cut.
          PKG=$(jq -r .version package.json)
          MAN=$(jq -r .version manifest.json)
          [ "$PKG" = "$MAN" ] \
            || { echo "version mismatch: package.json=$PKG manifest.json=$MAN"; exit 1; }

      - name: Enforce bundle size budget
        run: |
          # Hard-fail on any single JS bundle over 1MB — well under store
          # limits, and a regression signal long before users feel it.
          oversized=$(find dist -name '*.js' -size +1M)
          if [ -n "$oversized" ]; then
            echo "JS bundles over the 1MB budget:"
            ls -lh $oversized
            exit 1
          fi

      - name: Package store zip
        run: |
          cd dist
          zip -qr ../pacify-extension.zip . -x '*.map' -x '*.DS_Store'
          cd ..
          if unzip -l pacify-extension.zip | grep -q '\.map$'; then
            echo "source maps must not ship in the store zip"
            exit 1
          fi
          size=$(stat -c%s pacify-extension.zip)
          echo "Store zip size: $((size / 1024)) KB"
          if [ "$size" -gt $((10 * 1024 * 1024)) ]; then
            echo "store zip exceeds the 10MB budget"
            exit 1
          fi

      - name: Upload extension artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pacify-extension
          path: pacify-extension.zip
          retention-days: 7

      # Unzipped build for the E2E job (and for sideloading via
      # chrome://extensions → Load unpacked).
      - name: Upload dist for E2E
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: E2E (Playwright)
    if: ((github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false)) && needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, build]
    env:
      CI: 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright system dependencies
        # Pulls in the shared libraries Chromium-family browsers need on CI.
        run: bunx playwright install-deps chromium

      - name: Install Chrome for Testing
        # Exercise the suite against real Chrome, the browser users actually run.
        # CHROME_PATH takes precedence in tests/e2e/helpers/extension-loader.ts;
        # without it the helper falls back to Playwright's full Chromium build
        # (NOT the headless shell, which cannot load extensions at all).
        run: |
          bunx @puppeteer/browsers install chrome@stable --path "$HOME/.cache/puppeteer"
          CHROME_BIN=$(find "$HOME/.cache/puppeteer/chrome" -type f -name chrome -path '*chrome-linux64*' | head -1)
          if [ -z "$CHROME_BIN" ]; then echo "Failed to locate Chrome for Testing binary" >&2; exit 1; fi
          chmod +x "$CHROME_BIN"
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "Using Chrome at: $CHROME_BIN"

      - name: Download built extension
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist

      - name: Run E2E tests
        run: bun run test:e2e:ci

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  required:
    name: Required CI
    if: always() && (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false)
    needs: ["changes", "checks", "test", "build", "e2e"]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          jobs = json.loads(os.environ['NEEDS'])
          assert jobs['changes']['result'] == 'success', 'Path detection failed'
          relevant = jobs.pop('changes')['outputs']['relevant']
          assert relevant in ('true', 'false')
          expected = 'success' if relevant == 'true' else 'skipped'
          assert all(job['result'] == expected for job in jobs.values()), jobs
          PYTHON
